name: GECA Central - acumular y alertar
on:
  schedule:
    - cron: '47 22 * * *' # Central: 22:47 España (Europe/Madrid; verano/invierno automaticos)
      timezone: Europe/Madrid
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: geca-central-writer
  cancel-in-progress: false
jobs:
  central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GECA_EXPERIMENTAL_DAYS: ${{ vars.GECA_EXPERIMENTAL_DAYS || '2' }}
      GH_TOKEN: ${{ github.token }}
      GECA_STEAM_REPO: ${{ vars.GECA_STEAM_REPO || 'yeifer86intl/geca-radar-public' }}
      GECA_TWITCH_REPO: ${{ vars.GECA_TWITCH_REPO || 'yeifer86intl/geca-twitch-public' }}
      GECA_REPO: ${{ github.repository }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar GitHub CLI y verificar credenciales
        run: |
          gh --version
          test -n "$GH_TOKEN"
      - name: Ejecutar pruebas antes de actualizar estado
        run: python -m unittest discover -s tests -v
      - name: Restaurar estado validado, obligatorio
        run: python scripts/release_state.py restore --db state/geca.sqlite3
      - name: Validar que los deltas de Steam y Twitch sean del día de Madrid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY_GUARD'
          import datetime as dt
          import json
          import os
          import subprocess
          from zoneinfo import ZoneInfo

          hoy = dt.datetime.now(ZoneInfo('Europe/Madrid')).date()
          fuentes = [
              (os.environ['GECA_STEAM_REPO'], 'geca-steam-delta'),
              (os.environ['GECA_TWITCH_REPO'], 'geca-twitch-delta'),
          ]

          def github_api(endpoint):
              p = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
              if p.returncode:
                  raise RuntimeError(f'Error en {endpoint}: {p.stderr.strip()}')
              return json.loads(p.stdout)

          for repo, nombre in fuentes:
              path = f'repos/{repo}/actions/artifacts?name={nombre}&per_page=100'
              datos = github_api(path)
              validos = []
              for a in datos.get('artifacts', []):
                  if a.get('name') != nombre or a.get('expired'):
                      continue
                  fecha = dt.datetime.fromisoformat(a['created_at'].replace('Z', '+00:00'))
                  if fecha.astimezone(ZoneInfo('Europe/Madrid')).date() != hoy:
                      continue
                  run = a.get('workflow_run') or {}
                  rid = run.get('id')
                  if not rid:
                      continue
                  r = github_api(f'repos/{repo}/actions/runs/{rid}')
                  if r.get('status') == 'completed' and r.get('conclusion') == 'success':
                      validos.append((rid, fecha))
              if not validos:
                  raise SystemExit(
                      f'BLOQUEADO: {repo} no publicó {nombre} hoy '
                      f'{hoy} (Europe/Madrid) desde una ejecución exitosa. '
                      'No se evaluarán alertas con datos antiguos.'
                  )
              rid, fecha = max(validos, key=lambda v: v[1])
              print(f'OK {repo}: {nombre}, run {rid}, fecha UTC {fecha.isoformat()}')
          PY_GUARD
      - name: Incorporar incrementos de las dos fuentes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pull_deltas.py --db state/geca.sqlite3 --limit 1000
      - name: Evaluar reglas del PDF y exportar resumen
        run: python scripts/central.py evaluate --db state/geca.sqlite3 --out outputs --experimental-days "$GECA_EXPERIMENTAL_DAYS"
      - name: Verificar integridad
        run: python scripts/central.py verify --db state/geca.sqlite3
      - name: Publicar nueva versión verificada y conservar la anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_state.py publish --db state/geca.sqlite3 --prune
      - name: Subir solamente reportes ligeros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geca-central-reportes
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
